<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Sensor Realtime</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #f5f5f5 0%, #e8f5e9 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header dengan soft green theme */
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: #1b5e20;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.7;
            font-weight: 500;
        }

        /* Grid layout untuk stat cards dengan soft green */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.08);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-left: 5px solid;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 24px rgba(52, 199, 89, 0.12);
        }

        /* Soft green color scheme */
        .stat-card.temp { border-left-color: #34C759; }
        .stat-card.humidity { border-left-color: #10B981; }
        .stat-card.light { border-left-color: #F59E0B; }
        .stat-card.soil { border-left-color: #8B7355; }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(52, 199, 89, 0.05) 0%, transparent 70%);
            border-radius: 50%;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #666;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1b5e20;
            margin-bottom: 4px;
        }

        .stat-unit {
            font-size: 0.9rem;
            color: #999;
            font-weight: 500;
        }

        .stat-icon {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 2rem;
            opacity: 0.15;
        }

        /* Charts container - hapus distribution chart */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.08);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .chart-card:hover {
            box-shadow: 0 8px 24px rgba(52, 199, 89, 0.12);
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1b5e20;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #34C759 0%, #10B981 100%);
            border-radius: 2px;
        }

        /* Gauge container dengan soft green */
        .gauge-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .gauge-wrapper {
            background: white;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.08);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .gauge-wrapper:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(52, 199, 89, 0.12);
        }

        .gauge-wrapper h3 {
            color: #1b5e20;
            margin-bottom: 16px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .gauge-canvas-wrapper {
            position: relative;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gauge-value {
            position: absolute;
            font-size: 1.8rem;
            font-weight: 700;
            color: #34C759;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .stat-card {
                padding: 16px;
            }

            .stat-value {
                font-size: 1.8rem;
            }

            .gauge-container {
                grid-template-columns: 1fr;
            }
        }

        .timestamp {
            text-align: center;
            color: #1b5e20;
            font-size: 0.9rem;
            margin-top: 20px;
            opacity: 0.7;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Header section -->
        <div class="header">
            <h1>🌱 Sensor Dashboard</h1>
            <p>Real-time Monitoring System</p>
        </div>

        <!-- Stat cards untuk nilai terkini -->
        <div class="stats-grid">
            <div class="stat-card temp">
                <div class="stat-icon">🌡️</div>
                <div class="stat-label">Suhu</div>
                <div class="stat-value"><span id="tempValue">--</span><span class="stat-unit">°C</span></div>
            </div>
            <div class="stat-card humidity">
                <div class="stat-icon">💧</div>
                <div class="stat-label">Kelembaban</div>
                <div class="stat-value"><span id="humidityValue">--</span><span class="stat-unit">%</span></div>
            </div>
            <div class="stat-card light">
                <div class="stat-icon">💡</div>
                <div class="stat-label">Cahaya</div>
                <div class="stat-value"><span id="lightValue">--</span><span class="stat-unit">lux</span></div>
            </div>
            <div class="stat-card soil">
                <div class="stat-icon">🌱</div>
                <div class="stat-label">Kelembaban Tanah</div>
                <div class="stat-value"><span id="soilValue">--</span><span class="stat-unit">%</span></div>
            </div>
        </div>

        <!-- Charts section - hapus distribution chart -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">Trend Suhu & Kelembaban</div>
                <canvas id="sensorChart"></canvas>
            </div>
        </div>

        <!-- Gauge section -->
        <div class="chart-card">
            <div class="chart-title">Status Sensor Real-time</div>
            <div class="gauge-container">
                <div class="gauge-wrapper">
                    <h3>Cahaya (Light)</h3>
                    <div class="gauge-canvas-wrapper">
                        <canvas id="lightGauge"></canvas>
                        <div class="gauge-value" id="lightGaugeValue">0%</div>
                    </div>
                </div>
                <div class="gauge-wrapper">
                    <h3>Kelembaban Tanah (Soil)</h3>
                    <div class="gauge-canvas-wrapper">
                        <canvas id="soilGauge"></canvas>
                        <div class="gauge-value" id="soilGaugeValue">0%</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="timestamp">
            <span id="lastUpdate">Last update: --:--:--</span>
        </div>
    </div>

    <script>
        const MAX_DATA_POINTS = 20;

        // --- 1. LINE CHART (TREND SUHU & KELEMBABAN) ---
        const ctxLine = document.getElementById('sensorChart').getContext('2d');
        const sensorChart = new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Suhu (°C)',
                        data: [],
                        borderColor: '#34C759',
                        backgroundColor: 'rgba(52, 199, 89, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointBackgroundColor: '#34C759',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointHoverRadius: 7
                    },
                    {
                        label: 'Kelembaban (%)',
                        data: [],
                        borderColor: '#10B981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointBackgroundColor: '#10B981',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointHoverRadius: 7
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: {
                            usePointStyle: true,
                            padding: 15,
                            font: { size: 12, weight: 600 },
                            color: '#1b5e20'
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(27, 94, 32, 0.9)',
                        padding: 12,
                        titleFont: { size: 13, weight: 600 },
                        bodyFont: { size: 12 },
                        borderColor: '#34C759',
                        borderWidth: 1
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(52, 199, 89, 0.05)' },
                        ticks: { font: { size: 11 }, color: '#666' }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { size: 11 }, color: '#666' }
                    }
                }
            }
        });

        // --- 2. GAUGE HELPER FUNCTION ---
        function createGauge(elementId, color) {
            const ctx = document.getElementById(elementId).getContext('2d');
            return new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Value', 'Remaining'],
                    datasets: [{
                        data: [0, 100],
                        backgroundColor: [color, '#f0f0f0'],
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    cutout: '75%',
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    }
                }
            });
        }

        // --- 3. INITIALIZE GAUGES ---
        const lightGauge = createGauge('lightGauge', '#F59E0B');
        const soilGauge = createGauge('soilGauge', '#8B7355');

        // --- 4. UPDATE DATA FUNCTION (TETAP SAMA LOGIKANYA) ---
        async function updateData() {
            try {
                const response = await fetch('/get_data');
                const data = await response.json();

                if (data.error) {
                    console.error("Error dari server:", data.error);
                    return;
                }
                
                // === UPDATE STAT CARDS ===
                const temp = data.readings.Temperature;
                const humidity = data.readings.Humidity;
                const light = data.readings.Light;
                const soil = data.readings.SoilMoisture;

                document.getElementById('tempValue').textContent = temp?.toFixed(1) || '--';
                document.getElementById('humidityValue').textContent = humidity?.toFixed(1) || '--';
                document.getElementById('lightValue').textContent = light?.toFixed(0) || '--';
                document.getElementById('soilValue').textContent = soil?.toFixed(1) || '--';

                // === UPDATE LINE CHART ===
                const tm = data.mytime;
                const newDate = new Date(tm.Year, tm.Month - 1, tm.MonthDay, tm.Hour, tm.Minute, tm.Second);
                const newLabel = newDate.toLocaleTimeString('id-ID');

                if (newLabel !== "Invalid Date" && temp !== undefined && humidity !== undefined) {
                    sensorChart.data.labels.push(newLabel);
                    sensorChart.data.datasets[0].data.push(temp);
                    sensorChart.data.datasets[1].data.push(humidity);

                    if (sensorChart.data.labels.length > MAX_DATA_POINTS) {
                        sensorChart.data.labels.shift();
                        sensorChart.data.datasets.forEach(dataset => dataset.data.shift());
                    }
                    sensorChart.update();
                }

                // === UPDATE GAUGES ===
                if (light !== undefined) {
                    lightGauge.data.datasets[0].data[0] = light;
                    lightGauge.data.datasets[0].data[1] = 100 - light;
                    document.getElementById('lightGaugeValue').textContent = light.toFixed(0) + '%';
                    lightGauge.update();
                }

                if (soil !== undefined) {
                    soilGauge.data.datasets[0].data[0] = soil;
                    soilGauge.data.datasets[0].data[1] = 100 - soil;
                    document.getElementById('soilGaugeValue').textContent = soil.toFixed(0) + '%';
                    soilGauge.update();
                }

                // === UPDATE TIMESTAMP ===
                document.getElementById('lastUpdate').textContent = `Last update: ${newLabel}`;

            } catch (error) {
                console.error("Gagal mengambil data:", error);
            }
        }

        // --- 5. INITIALIZE & START POLLING ---
        document.addEventListener('DOMContentLoaded', updateData);
        setInterval(updateData, 3000);
    </script>

</body>
</html>
